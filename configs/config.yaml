project:
  random_state: 42
data:
  path: data/sample/air_quality_sample.csv
  timestamp_column: timestamp
  station_column: station
  target_column: PM2.5
  required_columns: [timestamp, station, PM2.5]
  optional_columns: [TSP, NO2, SO2, CO, O3, temperature, humidity]
  zero_as_missing: false
features:
  lags: [1, 2, 3, 6, 12, 24]
  rolling_windows: [3, 6, 24]
  exogenous_columns: [TSP, NO2, SO2, CO, O3, temperature, humidity]
split:
  test_fraction: 0.2
model:
  name: random_forest
  params:
    n_estimators: 200
    max_depth: 12
    min_samples_leaf: 2
    n_jobs: -1
thresholds:
  good_max: 12.0
  moderate_max: 35.5
artifacts:
  directory: artifacts
  model_file: model.joblib
  metadata_file: metadata.json
mlflow:
  enabled: false
  tracking_uri: mlruns
  experiment_name: hcmc-pm25-next-hour

