services:
  api:
    build: .
    ports:
      - "8000:8000"
  dashboard:
    build: .
    command: ["streamlit", "run", "app/dashboard.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      PM25_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
